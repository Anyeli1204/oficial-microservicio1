services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: scrapetok-accounts-db
    environment:
      POSTGRES_DB: scrapetok_accounts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d
    networks:
      - scrapetok-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microservicio de Cuentas
  accounts-service:
    build: .
    container_name: scrapetok-accounts-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: scrapetok_accounts
      DB_USER: postgres
      DB_PASSWORD: password
      JWT_SECRET: mySecretKeyForProduction
      JWT_EXPIRATION: 86400000
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scrapetok-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/v1/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # pgAdmin para gestión de base de datos (opcional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: scrapetok-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@scrapetok.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - scrapetok-network
    profiles:
      - admin

volumes:
  postgres_data:

networks:
  scrapetok-network:
    driver: bridge
