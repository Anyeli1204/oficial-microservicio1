server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/scrapetok_accounts
    username: scrapetok_user
    password: scrapetok_password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

# JWT Configuration
jwt:
  secret: local-jwt-secret-key-for-testing-only-256-bits
  expiration: 86400000

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true
    db:
      enabled: true
    mail:
      enabled: false

logging:
  level:
    com.scrapetok.accounts: DEBUG
    org.springframework.security: WARN
