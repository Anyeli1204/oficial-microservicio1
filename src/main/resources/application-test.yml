server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

# JWT Configuration
jwt:
  secret: testSecretKey123456789012345678901234567890
  expiration: 86400000

# CORS Configuration
cors:
  allowed-origins: http://localhost:3000,http://localhost:5173

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      enabled: true
  health:
    defaults:
      enabled: true
    db:
      enabled: true
    mail:
      enabled: false

logging:
  level:
    com.scrapetok.accounts: DEBUG
    org.springframework.security: DEBUG
