version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_c
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: utec
      POSTGRES_DB: scrapetok_accounts
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - red_bd
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: adminer_c
    restart: unless-stopped
    networks:
      - red_bd
    ports:
      - "8080:8080"

volumes:
  postgres_data:

networks:
  red_bd:
    driver: bridge
